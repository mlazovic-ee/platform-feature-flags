apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Kill switch for KICKs goal progress (KICK-9825). Consumed by chnl-modules-worker from
      # kicks.gifted; off means gifted KICKs are consumed and dropped, not replayed later.
      channel_goals_kicks_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: "REPLACE_WITH_OSRS_CAMPAIGN_ULID"
          disabled: ""
      # Kill switch for first-time chatter claims in chat-history-service; flip to disabled to stop claiming.
      first_time_chatter_claims_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      first_time_chatter_feed_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_dual_write:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_bulk_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      legacy_ccv_write_disabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ws_viewer_count_go_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Enable IVS view counts globally or specify a livestream id
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 38 # set the active livestream
            - enabled
            - disabled
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 27
            - enabled
            - disabled
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: DISABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: log
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 0
        targeting:
          if:
            - and:
              - in:
                - var: chatroom_id
                - []
              - '==':
                - var: event_name
                - 'App\Events\ChatMessageEvent'
            - enabled
      monolith_remove_session_auth:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      use_ptfm_ws:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_rollout_routing_state:
        state: ENABLED
        defaultVariant: legacy_only
        variants:
          legacy_only: "legacy_only"
          shadow: "shadow"
          new_only: "new_only"
      ntfr_push_retry_after_deadline_exceeded:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Seeds the default channel points reward (Hydrate) for channels that have
      # channel points enabled and no rewards of their own (KICK-9784). Consumed by
      # chnl-rewards-service. Targeting supports ramping by channel_id.
      seed_default_channel_rewards_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_use_fake_fcm:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_bridge_write_freeze:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # KICK-9826: gates the 25,000 KICKs purchase tier ($267.99 / R$1,316.20,
      # web/Stripe only). Off until the bundle exists in this environment's Stripe
      # account. Fails OPEN: an unresolvable flag hides the tier rather than
      # selling it.
      paym_kicks_tier_25000_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_connection_routing:
        state: ENABLED
        defaultVariant: centrifugo
        variants:
          pusher: "pusher"
          centrifugo: "centrifugo"
      paym_read_outbox_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_read_shadow_sample_percent:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          percent_1: 1
          percent_5: 5
          percent_10: 10
          percent_25: 25
          percent_50: 50
          percent_100: 100
      # Bridge read RPCs answered by paym-read-service, comma-separated; none = the bridge answers everything itself.
      paym_read_serve_methods:
        state: ENABLED
        defaultVariant: none
        variants:
          none: ""
          serve: "CountSubscriptionsForChannels"
      use_recommender_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
