apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic
      trust-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Masthead Display Ads
      web-4:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # In-feed Ads
      web-4-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads
      web-4-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - c.li@easygo.io # Coco
                  - c.tzoumanekas@easygo.io # Costa
                  - el.liu@easygo.io # Elaine
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads - opt-in page
      web-4-4:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - el.liu@easygo.io # Elaine
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
                  - edward@easygo.io # Eddie
                  - c.nehme@easygo.io # Charbel
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation
      web-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 1.5
      web-5-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Playback API
      web-playback:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Ads Preferences
      web-4-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - j.khan@easygo.io # Zeb
                  - k.camacho@easygo.io # Kyrie
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Playback API - Infer content type from URL
      web-playback-infer-content-type:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Onboarding flow
      web-5-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Watch time storage and eligibility
      web-7:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # the web-9 feature flags all fall under streamer analytics
      # Overview section
      web-9-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - streamer
      web-9-3:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - guest
      web-9-4:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Individual Stream section
      web-9-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
