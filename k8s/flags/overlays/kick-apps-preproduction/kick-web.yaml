        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # the web-9 feature flags all fall under streamer analytics
      # Overview section
      web-9-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - streamer
      web-9-3:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - guest
      web-9-4:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Individual Stream section
      web-9-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      web-10:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Dynamic encoding settings in frontend to call chnl-engagement-service for channel_type values
      encoding-settings:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Gamification Phase 1 - Global badges + leveling dropdown
      web-16-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Insider SDK
      web-12:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Show view count
      web-17:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Partner fast track
      web-18:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
