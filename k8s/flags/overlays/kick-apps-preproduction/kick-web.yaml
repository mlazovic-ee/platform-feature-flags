        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - el.liu@easygo.io # Elaine
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
                  - edward@easygo.io # Eddie
                  - c.nehme@easygo.io # Charbel
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # KICK Ads policy page
      web-4-5:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation
      web-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 2
      web-5-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 3
      web-5-3:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Home page Embedded chat 
      embedded-chat:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Playback API
      web-playback:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Ads Preferences
      web-4-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - j.khan@easygo.io # Zeb
                  - k.camacho@easygo.io # Kyrie
            - enabled
            - disabled
        variants:
          disabled: false
