apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Enable IVS view counts globally or specify a livestream id
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 38 # set the active livestream
            - enabled
            - disabled
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      vod_tiering:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
