apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: "REPLACE_WITH_OSRS_CAMPAIGN_ULID"
          disabled: ""
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
      # VAP-511: subscribers (paid or gifted) skip ads on the channel they sub to.
      # Kill switch — flip to `disabled` if paym-bridge degrades and we need
      # ads back on for everyone.
      media_metadata_subscriber_ad_optout_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_dual_write:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_bulk_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      legacy_ccv_write_disabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Enable IVS view counts globally or specify a livestream id
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 38 # set the active livestream
            - enabled
            - disabled
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: DISABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: log
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view_count_outbox_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chnl_settings_batch_get_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      disable-verified-check:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      ptfm_ws_router_sharding_mode:
        state: ENABLED
        defaultVariant: none
        variants:
          none: 0 # no sharding, just return default
          client_conn: 1 # sharding on client connections only
          chatroom_conn: 2 # sharding on chatroom connections only
          both: 3 # sharding on both client and chatroom connections
      # KICK-9703: seed-window kill switch for async Stripe customer creation.
      # When ENABLED, the monolith InternalStripeCustomerController::createCustomerAccount
      # skips the Stripe call and returns 200 (caller does not retry). Removes the
      # create-customer-account worker-starving storm that capped preprod user seeding
      # (Stripe ~25/s sandbox cap + paym-user-events-processor 3x retry, sharing the
      # php-monolith-rollout worker pool with createUser). Preproduction-only, for the
      # seeding window — flip to `disabled` afterward; seeded users have no stripe_id
      # until reconciled. Requires monolith PR #20645.
      disable_stripe_customer_creation:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 50
        targeting:
          if:
            - and:
                - in:
                    - var: chatroom_id
                    - []
                - "==":
                    - var: event_name
                    - 'App\Events\ChatMessageEvent'
            - enabled
