apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-open-feature

resources:
  - ../../base
  - kick-backend.yaml
  - kick-platform.yaml
  - kick-mobile.yaml
  - kick-tv.yaml
  - kick-web.yaml
patches:
  - target:
      group: core.openfeature.dev
      version: v1beta1
      kind: Flagd
      name: client-side
    patch: |-
      - op: replace
        path: /spec/ingress/hosts/0
        value: flags.kick-preproduction.com
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      group: core.openfeature.dev
      version: v1beta1
      kind: Flagd
      name: server-side
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
