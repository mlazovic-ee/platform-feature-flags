            "40.19.2": "60006882"
            "40.20.0": "60006888"
            "40.21.0": "60006889"
          disabled: {}
      # The minimum version that a forced update requires for ios.
      mobileIosForcedUpdateVersion:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default: "40.4.9"
          disabled: ""
      # Versions the app recommends updating to for ios.
      mobileIosSuggestedUpdates:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default:
            versions:
              - "40.21.0"
          disabled: {}
      # A map from different ios/android versions to the same app version.
      # Not needed anymore since all verssions were unified but kept until the old versions are not used anymore
      mobileIosVersionMap:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default:
            "40.5.0": "3.1.6"
            "40.5.2": "3.1.7"
            "40.5.3": "3.1.8"
            "40.5.4": "3.1.9"
