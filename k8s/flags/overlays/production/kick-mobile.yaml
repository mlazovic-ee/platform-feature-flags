            "40.21.0": "40.21.0"
          disabled: {}
      # Send video data to MUX, the video data analytics platform.
      # If disabled, the MUX listener on the native side will never be initialised, and the data will never get sent.
      muxVideoAnalytics:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.20.0"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      oldCountEP:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.22.0"
            - disabled
        variants:
          enabled: true
          disabled: false
      collectiblesEnabled:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
