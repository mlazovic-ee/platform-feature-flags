apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-mobile
spec:
  flagSpec:
    flags:
      # Shows an age assurance banner on the home screen.
      ageAssuranceBanner:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Require the user to do age verification
      ageAssuranceEnforcement:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      ageAssuranceLaxFlow:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.19.0"
            - disabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Show or hide the app rating bottom sheet.
      # The bottom sheet is opened explicitly within features, but this flag can stop the sheet from showing entirely.
      appRating:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      # This feature was built but then never went live.
      # Since it has been so long since it was built, it should not be turned on without extensive testing again.
      channelGoals:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Whether or not to force show the OTA update screen.
      # Only used in certain OTA releases to enforce minimum versions.
      forcedUpdateOta:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      fpjsCache:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default: 86400
          disabled: 0
      insider:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.15.0"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      fpjsProd:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - enabled
        variants:
          enabled: true
          disabled: false
      # The minimum version that a forced update requires for android.
      mobileAndroidForcedUpdateVersion:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default: "40.14.2"
          disabled: ""
      # Versions the app recommends updating to for android.
      mobileAndroidSuggestedUpdates:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default:
            versions:
              - "40.21.0"
          disabled: {}
      # A map from different ios/android versions to the same app version.
      # Not needed anymore since all verssions were unified but kept until the old versions are not used anymore
      mobileAndroidVersionMap:
        state: ENABLED
        defaultVariant: default
        targeting:
          if:
            - sem_ver:
                - var: app.version
                - <
                - "40.14.6"
            - disabled
            - default
        variants:
          default:
            "40.5.0": "60006582"
            "40.5.2": "60006596"
            "40.5.3": "60006597"
            "40.5.4": "60006599"
            "40.5.5": "60006600"
            "40.5.6": "60006606"
            "40.6.0": "60006625"
            "40.6.1": "60006628"
            "40.6.2": "60006636"
            "40.7.0": "60006644"
