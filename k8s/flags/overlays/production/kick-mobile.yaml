            "40.14.0": "40.14.0"
            "40.14.1": "40.14.1"
            "40.14.2": "40.14.2"
            "40.14.3": "40.14.3"
            "40.14.4": "40.14.4"
            "40.14.6": "40.14.6"
            "40.14.7": "40.14.7"
            "40.15.0": "40.15.0"
            "40.16.0": "40.16.0"
            "40.18.0": "40.18.0"
            "40.18.1": "40.18.1"
            "40.19.0": "40.19.0"
            "40.19.1": "40.19.1"
            "40.19.2": "40.19.2"
