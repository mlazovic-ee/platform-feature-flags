      # Controls whether cipr-engine-worker should compute hourly rate or use the legacy rate.
      cipr_engine_computed_hourly_rate:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # 10Milly load test (KICK-9861): preprod-only bypass; defined here so evaluation resolves cleanly to off.
      loadtest_third_party_bypass:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
