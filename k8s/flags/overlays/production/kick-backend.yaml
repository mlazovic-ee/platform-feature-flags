apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 21512519 # luke
                  - 23812321 # jett
            - fractional:
                  - - pusher
                    - 50
                  - - pusher2
                    - 50
            - pusher
