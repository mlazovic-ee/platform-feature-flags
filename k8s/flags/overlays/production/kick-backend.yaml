apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Kill switch for KICKs goal progress (KICK-9825). Consumed by chnl-modules-worker from
      # kicks.gifted; off means gifted KICKs are consumed and dropped, not replayed later.
      channel_goals_kicks_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: "01KY6KCAZXYR9FAB5YZJD9A0QN" # OSRS Campaign ULID
          disabled: ""
      # Kill switch for first-time chatter claims in chat-history-service; flip to disabled to stop claiming.
      first_time_chatter_claims_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      first_time_chatter_feed_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
          fiftyPercent: 0.5
      # VAP-511: subscribers (paid or gifted) skip ads on the channel they sub to.
      # Kill switch — flip to `disabled` if paym-bridge degrades and we need
      # ads back on for everyone.
      media_metadata_subscriber_ad_optout_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_dual_write:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_bulk_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      legacy_ccv_write_disabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_viewer_count_go_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
          pusher3: "pusher-3"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - pusher
                  - 100
                - - pusher2
                  - 0
                - - pusher3
                  - 0
            - pusher
      broadcast_chat_to_pusher:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - enabled
                  - 100
                - - disabled
                  - 0
            - enabled
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 79076551 # set the active livestream
            - enabled
            - disabled
      schema_based_producers_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_stripe_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # When enabled, monolith would call chat-history-service to
      # check if a given user has ever sent a message in a channel.
      user_channel_has_chatted:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chnl_settings_batch_get_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      disable-verified-check:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      ptfm_ws_router_sharding_mode:
        state: ENABLED
        defaultVariant: both
        variants:
          none: 0 # no sharding, just return default
          client_conn: 1 # sharding on client connections only
          chatroom_conn: 2 # sharding on chatroom connections only
          both: 3 # sharding on both client and chatroom connections
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 0
        targeting:
          if:
            - and:
                - in:
                    - var: chatroom_id
                    - []
                - "==":
                    - var: event_name
                    - 'App\Events\ChatMessageEvent'
            - enabled
      monolith_remove_session_auth:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # The monolith's GET /api/v1/user asks cmpl-consent for the terms version the user stands on (DII-732).
      # disabled: cmpl-consent is never asked and tos_accepted_version reads "unknown".
      # enabled: the version is read live; "not_signed" when cmpl-consent holds no acceptance.
      monolith_tos_accepted_version:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Seeds the default channel points reward (Hydrate) for channels that have
      # channel points enabled and no rewards of their own (KICK-9784). Consumed by
      # chnl-rewards-service. Targeting supports ramping by channel_id.
      seed_default_channel_rewards_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_bridge_write_freeze:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # KICK-9826: gates the 25,000 KICKs purchase tier ($267.99 / R$1,316.20,
      # web/Stripe only). Fails OPEN: an unresolvable flag hides the tier rather
      # than selling it.
      paym_kicks_tier_25000_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_connection_routing:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          centrifugo: "centrifugo"
        targeting:
          if:
            # allowlisted user_ids → centrifugo
            - in:
                - var: user_id
                - - 22042650 # alex
                  - 52915131 # nick
                  - 40503966 # raf
                  - 40655653 # yoshi
                  - 80820982 # edwin
                  - 30497681 # jc
                  - 166397 # someonewill
                  - 43862767 # thegoodkicker
                  - 96257607 # tan - tv
                  - 98726725 # tan - android go live
                  - 74167921 # jordan - ios go live
            - centrifugo
            # web clients
            - "==":
                - var: client_type
                - web
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # webchat-streaming
            - "==":
                - var: client_type
                - webchat-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-tv
            - "==":
                - var: client_type
                - android-tv
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-streaming
            - "==":
                - var: client_type
                - android-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # ios-streaming
            - "==":
                - var: client_type
                - ios-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-go-live
            - "==":
                - var: client_type
                - android-go-live
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # ios-go-live
            - "==":
                - var: client_type
                - ios-go-live
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # default to centrifugo
            - centrifugo
      paym_read_outbox_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_read_shadow_sample_percent:
        state: ENABLED
        defaultVariant: percent_10
        variants:
          disabled: 0
          percent_1: 1
          percent_5: 5
          percent_10: 10
          percent_25: 25
          percent_50: 50
          percent_100: 100
      # Bridge read RPCs answered by paym-read-service, comma-separated; none = the bridge answers everything itself.
      paym_read_serve_methods:
        state: ENABLED
        defaultVariant: serve
        variants:
          none: ""
          serve: "CountSubscriptionsForChannels,CountUserGiftsToChannel,GetFirstSubAtForUserChannel,GetUserStatusOnChannelCached,GetUserStatusOnChannel"
      use_recommender_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      subcategory_ingest_auto_approve:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      subcategory_ingest_auto_approve_min_ratings:
        state: ENABLED
        defaultVariant: top10k
        variants:
          top10k: 10
          all: 0
      # media-provider migration: routes channel provider verbs in the monolith
      # (RoutingChannelProvider) from direct IVS to media-provider, one flag per
      # verb. Evaluated per call with channel_id in context, so targeting can
      # ramp by channel. Turning a flag off routes the very next call back to
      # direct IVS.
      mp_authoritative_provision:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      mp_authoritative_credentials:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        # Ramped by channel: fractional buckets on the targeting key (the
        # channel id), so raising the share keeps every channel already on.
        targeting:
          fractional:
            - - enabled
              - 15
            - - disabled
              - 85
      mp_authoritative_rotate:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      mp_authoritative_stop:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Covers both ban and unban.
      mp_authoritative_enforcement:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      mp_authoritative_config:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      featured_channels_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      browse_page_read_from_registry:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
