      # PHP /leaderboards reads the gifted subs period flags from chnl-settings instead of its cache (KICK-9859).
      # Goes on together with kick-web leaderboard-settings at 100%.
      subs_leaderboard_settings_from_go:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Caption languages still in rollout (comma-separated ISO 639-1 codes). media-metadata gives them only to
      # viewers for whom this list is empty. Context: user_id, the legacy user ID of the viewer ("" when signed out).
      caption_languages_staff_only:
        state: ENABLED
        defaultVariant: arabic-turkish
        variants:
          arabic-turkish: "ar,tr"
          none: ""
        targeting:
          if:
            - in:
                - var: [user_id, ""]
                # Legacy user IDs of staff viewers, as strings.
                - - "60492524" # R Elgohary
                  - "31006986" # Berat Kaya
                  - "47336174" # Andre Fernandes
                  - "106881375" # Damitha Gunawardena
                  - "107878093" # Zaid Almsafir
                  - "100226441" # Noor Qassab
            - none
            - arabic-turkish
      # Kill switch for GET /v1/livestreams/live-totals on gateway-web (KICK-9866). The same key gates the
      # home page component in kick-web.yaml; flip both to turn the feature off end to end.
      home-live-totals:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      monolith_queue_go_follower_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
