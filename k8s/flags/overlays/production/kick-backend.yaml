apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: "01KY6KCAZXYR9FAB5YZJD9A0QN" # OSRS Campaign ULID
          disabled: ""
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
          fiftyPercent: 0.5
      # VAP-511: subscribers (paid or gifted) skip ads on the channel they sub to.
      # Kill switch — flip to `disabled` if paym-bridge degrades and we need
      # ads back on for everyone.
      media_metadata_subscriber_ad_optout_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_dual_write:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      viewer_ccv_sharding_bulk_read:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      legacy_ccv_write_disabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_viewer_count_go_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
          pusher3: "pusher-3"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - pusher
                  - 100
                - - pusher2
                  - 0
                - - pusher3
                  - 0
            - pusher
      broadcast_chat_to_pusher:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - enabled
                  - 100
                - - disabled
                  - 0
            - enabled
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 79076551 # set the active livestream
            - enabled
            - disabled
      schema_based_producers_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      user_events_stripe_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view_count_outbox_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revoke IVS key on ban (EI-24) - prevents banned users streaming via 3P restream providers
      revoke_ivs_key_on_ban:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: user.email
                - - k.camacho@easygo.io # Kyrie
                  - egbanuser@easygo.mailosaur.net # Kyrie Test
            - enabled
            - disabled
      # When enabled, monolith would call chat-history-service to
      # check if a given user has ever sent a message in a channel.
      user_channel_has_chatted:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chnl_settings_batch_get_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      disable-verified-check:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      ptfm_ws_router_sharding_mode:
        state: ENABLED
        defaultVariant: none
        variants:
          none: 0 # no sharding, just return default
          client_conn: 1 # sharding on client connections only
          chatroom_conn: 2 # sharding on chatroom connections only
          both: 3 # sharding on both client and chatroom connections
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 0
        targeting:
          if:
            - and:
                - in:
                    - var: chatroom_id
                    - []
                - "==":
                    - var: event_name
                    - 'App\Events\ChatMessageEvent'
            - enabled
      monolith_remove_session_auth:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      use_ptfm_ws:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - starts_with:
                - var: service
                - 'php-'
            - disabled
            - enabled
      ntfr_ingest_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_push_retry_after_deadline_exceeded:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Seeds the default channel points reward (Hydrate) for channels that have
      # channel points enabled and no rewards of their own (KICK-9784). Consumed by
      # chnl-rewards-service. Targeting supports ramping by channel_id.
      seed_default_channel_rewards_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      channel_points_follow_earn_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      channel_points_subscription_earn_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      channel_points_subscriber_multiplier_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
