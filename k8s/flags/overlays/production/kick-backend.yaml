apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
          fiftyPercent: 0.5
      # VAP-511: subscribers (paid or gifted) skip ads on the channel they sub to.
      # Kill switch — flip to `disabled` if paym-bridge degrades and we need
      # ads back on for everyone.
      media_metadata_subscriber_ad_optout_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
          pusher3: "pusher-3"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - pusher
                  - 100
                - - pusher2
                  - 0
                - - pusher3
                  - 0
            - pusher
      broadcast_chat_to_pusher:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - enabled
                  - 100
                - - disabled
                  - 0
            - enabled
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 79076551 # set the active livestream
            - enabled
            - disabled
      schema_based_producers_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_stripe_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: log
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view_count_outbox_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revoke IVS key on ban (EI-24) - prevents banned users streaming via 3P restream providers
      revoke_ivs_key_on_ban:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: user.email
                - - k.camacho@easygo.io # Kyrie
                  - egbanuser@easygo.mailosaur.net # Kyrie Test
            - enabled
            - disabled
      # When enabled, monolith would call chat-history-service to
      # check if a given user has ever sent a message in a channel.
      user_channel_has_chatted:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chnl_settings_batch_get_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      overview_charts:
        state: ENABLED
        defaultVariant: public
        variants:
          internal:
            avg_ccv: true
            peak_ccv: true
            unique_viewers: true
            stream_count: true
            hours_streamed: true
            hours_watched: true
            subscribers_gained: true
            subscriber_count: true
            follower_count: true
            unique_chatters: true
            followers_gained: true
            chat_messages: true
            chat_rate: true
          public:
            avg_ccv: false
            peak_ccv: false
            unique_viewers: false
            stream_count: false
            hours_streamed: false
            hours_watched: false
            subscribers_gained: false
            subscriber_count: false
            follower_count: false
            unique_chatters: false
            followers_gained: false
            chat_messages: false
            chat_rate: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - internal
            - public
