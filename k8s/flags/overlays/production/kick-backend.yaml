apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Kill switch for KICKs goal progress (KICK-9825). Consumed by chnl-modules-worker from
      # kicks.gifted; off means gifted KICKs are consumed and dropped, not replayed later.
      channel_goals_kicks_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: "01KY6KCAZXYR9FAB5YZJD9A0QN" # OSRS Campaign ULID
          disabled: ""
      # Kill switch for first-time chatter claims in chat-history-service; flip to disabled to stop claiming.
      first_time_chatter_claims_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      first_time_chatter_feed_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Emits the client-side IMA SDK ad tag (playback_url.imasdk) for live prerolls in media-metadata.
      media_metadata_ima_tag_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Returns the live DVR seekbar storyboard config (GetPlayback storyboard) from media-metadata.
      media_metadata_live_storyboard_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
          pusher3: "pusher-3"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - pusher
                  - 100
                - - pusher2
                  - 0
                - - pusher3
                  - 0
            - pusher
      broadcast_chat_to_pusher:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 23812321 # jett
                  - 669746 # Westcol
            - fractional:
                - - enabled
                  - 100
                - - disabled
                  - 0
            - enabled
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 79076551 # set the active livestream
            - enabled
            - disabled
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_stripe_outbox:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      chat_monolith_publish_via_ingest:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_ingest_pinned_messages_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # DII-804: the monolith's stream key reveal (StreamController::getPublishToken) checks the
      # authenticator code through user-identity's VerifyTotp. Read by the PHP monolith, targeted by
      # user id (targetingKey) for a ramp.
      # off: the monolith's own google2fa check decides, user-identity is not asked
      # shadow: the monolith decides, user-identity is asked too, both verdicts logged ("totp shadow verification")
      # enforce: user-identity decides; a lockout is 429, an outage 503
      user_identity_verify_totp_stream_key:
        state: ENABLED
        defaultVariant: enforce
        variants:
          "off": "off"
          shadow: "shadow"
          enforce: "enforce"
      user_identity_verify_totp_legacy_login:
        state: ENABLED
        defaultVariant: enforce
        variants:
          "off": "off"
          shadow: "shadow"
          enforce: "enforce"
      user_identity_totp_status:
        state: ENABLED
        defaultVariant: "off"
        variants:
          "off": "off"
          shadow: "shadow"
          enforce: "enforce"
        # DII-804 shadow ramp: bucketed on the user id (targetingKey), so a user is in or out at every reader.
        # shadow stays first so the cohort only grows: the 1% users of 2026-10-28, the 10% of 2026-10-29 and the
        # 50% of 2026-11-03 are inside the 100%. The fractional rule stays at 100 / 0 rather than moving the
        # default to shadow, so stepping back to 50 is a change of these two numbers only. Next step is enforce,
        # for everyone at once (defaultVariant enforce, no ramp), once the shadow has agreed at 100%.
        targeting:
          fractional:
            - - shadow
              - 100
            - - "off"
              - 0
      # DII-934: Google and Apple SSO served by user-identity instead of the monolith's Socialite path (epic
      # DII-931). Read by the PHP monolith only; Go has no flag, OAUTH_PROVIDERS gates its providers.
      #   user_identity_sso_google  POST /socialite/google, SocialiteController::redirectToProvider (web)
      #   user_identity_sso_apple   POST /socialite/apple, the same method (web)
      #   user_identity_sso_mobile  POST /api/v1/google-mobile-login and /api/v1/apple-mobile-login (the apps)
      # Context contract: targetingKey is a UUID the monolith mints per evaluation, so the fractional rule is a
      # share of requests (never X-Request-ID, the frontend's device fingerprint, which would make the share
      # sticky per device); an absent or empty key lands on defaultVariant without a word. email is the
      # provider's email, known before deciding on the mobile endpoints only and "" on the web initiate, so the
      # allowlist matches on mobile alone. A ramp or a rollback is a change of these numbers only; the rest is
      # in user-identity's README, "SSO via user-identity: the monolith's flags".
      user_identity_sso_google:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      user_identity_sso_apple:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      user_identity_sso_mobile:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      disable-verified-check:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      ptfm_ws_router_sharding_mode:
        state: ENABLED
        defaultVariant: both
        variants:
          none: 0 # no sharding, just return default
          client_conn: 1 # sharding on client connections only
          chatroom_conn: 2 # sharding on chatroom connections only
          both: 3 # sharding on both client and chatroom connections
      ptfm_ws_chat_rate_limit_per_sec:
        state: ENABLED
        defaultVariant: unlimited
        variants:
          unlimited: 0
          chat_message: 600
        targeting:
          if:
            - "==":
                - var: event_name
                - 'App\Events\ChatMessageEvent'
            - chat_message
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 0
        targeting:
          if:
            - and:
                - in:
                    - var: chatroom_id
                    - []
                - "==":
                    - var: event_name
                    - 'App\Events\ChatMessageEvent'
            - enabled
      monolith_remove_session_auth:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # The monolith's GET /api/v1/user asks cmpl-consent for the terms version the user stands on (DII-732).
      # disabled: cmpl-consent is never asked and tos_accepted_version reads "unknown".
      # enabled: the version is read live; "not_signed" when cmpl-consent holds no acceptance.
      monolith_tos_accepted_version:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      monolith_featured_livestreams_from_registry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_streak_at_risk_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Seeds the default channel points reward (Hydrate) for channels that have
      # channel points enabled and no rewards of their own (KICK-9784). Consumed by
      # chnl-rewards-service. Targeting supports ramping by channel_id.
      seed_default_channel_rewards_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_bridge_write_freeze:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # KICK-9826: gates the 25,000 KICKs purchase tier ($267.99 / R$1,316.20,
      # web/Stripe only). Fails OPEN: an unresolvable flag hides the tier rather
      # than selling it.
      paym_kicks_tier_25000_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_connection_routing:
        state: ENABLED
        defaultVariant: centrifugo
        variants:
          pusher: "pusher"
          centrifugo: "centrifugo"
        targeting:
          if:
            # allowlisted user_ids → centrifugo
            - in:
                - var: user_id
                - - 22042650 # alex
                  - 52915131 # nick
                  - 40503966 # raf
                  - 40655653 # yoshi
                  - 80820982 # edwin
                  - 30497681 # jc
                  - 166397 # someonewill
                  - 43862767 # thegoodkicker
                  - 96257607 # tan - tv
                  - 98726725 # tan - android go live
                  - 74167921 # jordan - ios go live
            - centrifugo
            # web clients
            - "==":
                - var: client_type
                - web
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # webchat-streaming
            - "==":
                - var: client_type
                - webchat-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-tv
            - "==":
                - var: client_type
                - android-tv
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-streaming
            - "==":
                - var: client_type
                - android-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # ios-streaming
            - "==":
                - var: client_type
                - ios-streaming
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # android-go-live
            - "==":
                - var: client_type
                - android-go-live
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # ios-go-live
            - "==":
                - var: client_type
                - ios-go-live
            - fractional:
                - - pusher
                  - 0
                - - centrifugo
                  - 100
            # default to centrifugo
            - centrifugo
      paym_read_outbox_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_read_shadow_sample_percent:
        state: ENABLED
        defaultVariant: percent_1
        variants:
          disabled: 0
          percent_1: 1
          percent_5: 5
          percent_10: 10
          percent_25: 25
          percent_50: 50
          percent_100: 100
      # Bridge read RPCs answered by paym-read-service, comma-separated; none = the bridge answers everything itself.
      paym_read_serve_methods:
        state: ENABLED
        defaultVariant: serve
        variants:
          none: ""
          serve: "CountSubscriptionsForChannels,CountUserGiftsToChannel,GetFirstSubAtForUserChannel,GetUserStatusOnChannelCached,GetUserStatusOnChannel"
      subcategory_ingest_auto_approve:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      subcategory_ingest_auto_approve_min_ratings:
