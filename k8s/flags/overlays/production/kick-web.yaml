apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # allow web clients to connect to pusher-2
      pusher-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      ia-redesign:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Kicks Pinned Messages
      web-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Masthead Display Ads
      web-4:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation
      web-5:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - a.sajiv@easygo.io # Ash
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - c.tzoumanekas@easygo.io # Costa
                  - el.liu@easygo.io # Elaine
                  - h.patel@easygo.io # Hemil
                  - k.bedi@easygo.io # KD
                  - k.camacho@easygo.io # Kyrie
                  - larissa@easygo.io # Larissa
                  - z.ingle@easygo.io # Zach
                  - j.khan@easygo.io # Zeb
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Playback API
      web-playback:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
                  - c.tatli@easygo.io # Chris
                  - eg_viewer@easygo.mailosaur.net
                  - eg_user@easygo.mailosaur.net
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # A/A test: feature flag phased rollout validation
      # Phase 2: 75/25 split (authenticated users only)
      aa-test-1:
        state: ENABLED
        defaultVariant: control
        variants:
          control: "control"
          variant-a: "variant-a"
          variant-b: "variant-b"
        targeting:
          if:
            - var: user.id
            - fractional:
                - - variant-a
                  - 75
                - - variant-b
                  - 25
            - control