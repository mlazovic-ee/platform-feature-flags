apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Drops Feature
      web1:
        defaultVariant: disabled
        state: ENABLED
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Featured Livestreams Web Gateway
      web-feat-livestreams:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Chat History Web Gateway
      web-chat-history:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true