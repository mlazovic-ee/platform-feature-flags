apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # KICKs goals in the streamer dashboard (KICK-9825)
      web-41:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Thumbnail Update - Toggle the ability for creators to update their channel thumbnail from the creator dashboard
      # disabled: not visible to creators
      # enabled: visible to creators with a button to update the thumbnail
      web-13-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - ends_with:
                - var: [user.email, ""]
                - "@easygo.io"
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Mux SDK Analytics - Toggle the mux sdk analytics sdk on the player for web clients
      # disabled: MuxTracker component not rendered, no data sent to Mux
      # enabled: MuxTracker component rendered, data sent to Mux
      web-13:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Go Live - Toggle the go live feature for creators
      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-23:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Download Profile for Recommended Encoding Settings - Link to download OBS profile file containing recommended encoding settings, which can be imported inside OBS
      # disabled: not visible to creators
      # enabled: visible to creators with a link to download the profile
      web-15:
        state: ENABLED
        defaultVariant: enabled
        targeting:
          if:
            - ends_with:
                - var: [user.email, ""]
                - "@easygo.io"
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
