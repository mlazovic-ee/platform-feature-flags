apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Kill switch for KICKs goal progress (KICK-9825). Consumed by chnl-modules-worker from
      # kicks.gifted; off means gifted KICKs are consumed and dropped, not replayed later.
      channel_goals_kicks_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      custom-osrs-reward:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: "REPLACE_WITH_OSRS_CAMPAIGN_ULID"
          disabled: ""
      # Kill switch for first-time chatter claims in chat-history-service; flip to disabled to stop claiming.
      first_time_chatter_claims_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      first_time_chatter_feed_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Controls the enablement of DataZoom VOD features in media metadata.
      media_metadata_datazoom_vod_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Emits the client-side IMA SDK ad tag (playback_url.imasdk) for live prerolls in media-metadata.
      media_metadata_ima_tag_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Returns the live DVR seekbar storyboard config (GetPlayback storyboard) from media-metadata.
      media_metadata_live_storyboard_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Enable IVS view counts globally or specify a livestream id
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 38 # set the active livestream
            - enabled
            - disabled
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: DISABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      reroute_update_profile_to_user_profile:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      chat_monolith_publish_via_ingest:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_ingest_pinned_messages_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: log
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # DII-934: Google and Apple SSO served by user-identity instead of the monolith's Socialite path (epic
      # DII-931). Read by the PHP monolith only; Go has no flag, OAUTH_PROVIDERS gates its providers.
      #   user_identity_sso_google  POST /socialite/google, SocialiteController::redirectToProvider (web)
      #   user_identity_sso_apple   POST /socialite/apple, the same method (web)
      #   user_identity_sso_mobile  POST /api/v1/google-mobile-login and /api/v1/apple-mobile-login (the apps)
      # Context contract: targetingKey is a UUID the monolith mints per evaluation, so the fractional rule is a
      # share of requests (never X-Request-ID, the frontend's device fingerprint, which would make the share
      # sticky per device); an absent or empty key lands on defaultVariant without a word. email is the
      # provider's email, known before deciding on the mobile endpoints only and "" on the web initiate, so the
      # allowlist matches on mobile alone. A ramp or a rollback is a change of these numbers only; the rest is
      # in user-identity's README, "SSO via user-identity: the monolith's flags".
      user_identity_sso_google:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      user_identity_sso_apple:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      user_identity_sso_mobile:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: [email, ""]
                - [] # staff allowlist, provider emails
            - enabled
            - fractional:
                - - enabled
                  - 0
                - - disabled
                  - 100
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_chat_rate_limit_per_sec:
        state: ENABLED
        defaultVariant: unlimited
        variants:
          unlimited: 0
          chat_message: 600
        targeting:
          if:
            - '==':
                - var: event_name
                - 'App\Events\ChatMessageEvent'
            - chat_message
      ptfm_ws_drop_chat_message_pct:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          enabled: 0
        targeting:
          if:
            - and:
              - in:
                - var: chatroom_id
                - []
              - '==':
                - var: event_name
                - 'App\Events\ChatMessageEvent'
            - enabled
      monolith_remove_session_auth:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # The monolith's GET /api/v1/user asks cmpl-consent for the terms version the user stands on (DII-732).
      # disabled: cmpl-consent is never asked and tos_accepted_version reads "unknown".
      # enabled: the version is read live; "not_signed" when cmpl-consent holds no acceptance.
      monolith_tos_accepted_version:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      monolith_featured_livestreams_from_registry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_ingest_streak_at_risk_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Seeds the default channel points reward (Hydrate) for channels that have
      # channel points enabled and no rewards of their own (KICK-9784). Consumed by
      # chnl-rewards-service. Targeting supports ramping by channel_id.
      seed_default_channel_rewards_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_use_fake_fcm:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_push_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ntfr_delivery_ws_transactional_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_bridge_write_freeze:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # KICK-9826: gates the 25,000 KICKs purchase tier ($267.99 / R$1,316.20,
      # web/Stripe only). Off until the bundle exists in this environment's Stripe
      # account. Fails OPEN: an unresolvable flag hides the tier rather than
      # selling it.
      paym_kicks_tier_25000_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ptfm_ws_connection_routing:
        state: ENABLED
        defaultVariant: centrifugo
        variants:
          pusher: "pusher"
          centrifugo: "centrifugo"
      paym_read_outbox_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      paym_read_shadow_sample_percent:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: 0
          percent_1: 1
          percent_5: 5
          percent_10: 10
          percent_25: 25
          percent_50: 50
          percent_100: 100
      # Bridge read RPCs answered by paym-read-service, comma-separated; none = the bridge answers everything itself.
      paym_read_serve_methods:
        state: ENABLED
        defaultVariant: none
        variants:
          none: ""
          serve: "CountSubscriptionsForChannels"
      featured_channels_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      lstm_registry_read_cache_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      featured_channels_slack_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      lstm_catalog_shadow_ban_source_trust:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      browse_page_read_from_registry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false

      # PHP /leaderboards reads the gifted subs period flags from chnl-settings instead of its cache (KICK-9859).
      # Goes on together with kick-web leaderboard-settings at 100%.
      subs_leaderboard_settings_from_go:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Caption languages still in rollout (comma-separated ISO 639-1 codes). media-metadata gives them only to
      # viewers for whom this list is empty. Context: user_id, the legacy user ID of the viewer ("" when signed out).
      caption_languages_staff_only:
        state: ENABLED
        defaultVariant: none
        variants:
          arabic-turkish: "ar,tr"
          none: ""
      # Caption languages media-captions GetCaptionSettings does not return. Context: channel_id.
      caption_settings_withheld_languages:
        state: ENABLED
        defaultVariant: none
        variants:
          arabic-turkish: "ar,tr"
          none: ""
      monolith_queue_go_follower_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # 10Milly load test (KICK-9861): the monolith, ntfr-email, paym-user-events-processor and trust-worker skip
      # SES, Stripe and Kasada for load-test accounts; never evaluated in production (code guard in the monolith).
      loadtest_third_party_bypass:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: email_domain
                - - loadtest.kick.com
                  - simulator.amazonses.com
            - enabled
            - disabled
      # ws-count-worker also pushes each cycle's display counts to the public channel.{id} websocket stream (PLAT-645).
      ws_count_worker_realtime_push_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      drops_tracker_use_lstm_registry:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false

      # CTE-3355: recent categories from lstm-hub.
      lstm_hub_recent_categories:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
