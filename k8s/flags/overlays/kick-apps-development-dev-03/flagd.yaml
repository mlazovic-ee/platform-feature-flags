apiVersion: core.openfeature.dev/v1beta1
kind: Flagd
metadata:
  name: client-side
spec:
  replicas: 2
  featureFlagSource: client-side
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/target-type: "ip"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/healthcheck-port: "8014"
      alb.ingress.kubernetes.io/healthcheck-path: "/readyz"
      external-dns.alpha.kubernetes.io/proxied: "true"
    hosts:
      - flags.dev-03.kick-development.com
    ingressClassName: kick-flags-alb
    pathType: Prefix
---
apiVersion: core.openfeature.dev/v1beta1
kind: Flagd
metadata:
  name: server-side
spec:
  replicas: 2
  featureFlagSource: server-side
