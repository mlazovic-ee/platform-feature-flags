apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Drops Feature - authenticated users
      web1:
        defaultVariant: enabled
        state: ENABLED
        variants:
          disabled: false
          enabled: true
      # Drops Feature - unauthenticated users
      web1-guest:
        defaultVariant: enabled
        state: ENABLED
        variants:
          disabled: false
          enabled: true
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # allow web clients to connect to pusher-2
      pusher-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      ia-redesign:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Kicks Pinned Messages
      web-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
