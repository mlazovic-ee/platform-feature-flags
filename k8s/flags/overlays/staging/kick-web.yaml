apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # allow web clients to connect to pusher-2
      pusher-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Kicks Pinned Messages
      web-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic on critical pages
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      example-ab-test:
        state: ENABLED
        defaultVariant: control
        variants:
          control: "control"
          variant-a: "variant-a"
          variant-b: "variant-b"
        targeting:
          if:
            - in:
                - b.choi@easygo.io
                - var: user.email
            - variant-a
            - if:
                - in:
                    - csh97@proton.me
                    - var: user.email
                - variant-b
                - control

      # Masthead Display Ads
      web-4:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # In-feed Ads
      web-4-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads
      web-4-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - a.sajiv@easygo.io # Ash
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - c.tzoumanekas@easygo.io # Costa
                  - el.liu@easygo.io # Elaine
                  - h.patel@easygo.io # Hemil
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
        # Mid-roll Ads - opt-in page
      web-4-4:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - el.liu@easygo.io # Elaine
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
                  - edward@easygo.io # Eddie
                  - c.nehme@easygo.io # Charbel
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation
      web-5:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 1.5
      web-5-1:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.sajiv@easygo.io # Ash
                  - b.choi@easygo.io # Brian
                  - c.tzoumanekas@easygo.io # Costa
                  - h.patel@easygo.io # Hemil
                  - k.bedi@easygo.io # KD
                  - k.camacho@easygo.io # Kyrie
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Playback API
      web-playback:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # A/A test: feature flag phased rollout validation
      # Phase 3: 50/50 split (authenticated users only)
      aa-test-1:
        state: ENABLED
        defaultVariant: control
        variants:
          control: "control"
          variant-a: "variant-a"
          variant-b: "variant-b"
        targeting:
          if:
            - var: user.id
            - fractional:
                - - variant-a
                  - 50
                - - variant-b
                  - 50
            - control
      # Ads Preferences
      web-4-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - j.khan@easygo.io # Zeb
                  - k.camacho@easygo.io # Kyrie
                  - kyrieteststage@easygo.mailosaur.net # Kyrie test
                  - el.liu@easygo.io # Elaine
                  - argentinaboy@sharebot.net #Milos test account
                  - killybeard91@gmail.com #Milos test account
                  - serbianboy@sharebot.net #Milos test account
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Playback API - Infer content type from URL
      web-playback-infer-content-type:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Onboarding flow
      web-5-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Watch time storage and eligibility
      web-7:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
