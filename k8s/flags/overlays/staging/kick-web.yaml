apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Drops Feature
      web1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
          targeting:
            if:
              - and:
                - ne:  [{ var: status }, "unauthenticated" ]   # status != "unauthenticated"
                - in:  [ "internal", { var: roles } ]          # roles contains "internal"
              - enabled   # variant when rule is true
              - disabled  # variant when rule is false
        

