        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads
      web-4-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - a.sajiv@easygo.io # Ash
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - c.tzoumanekas@easygo.io # Costa
                  - el.liu@easygo.io # Elaine
                  - h.patel@easygo.io # Hemil
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - stage1.up@wn1lxpnt.mailosaur.net #Leon test account
                  - j.reyesvera@easygo.io # Juan
                  - z.ingle@easygo.io # Zach
                  - f.mena@easygo.io # Felipe
                  - m.goutry@easygo.io # Martin
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads - opt-in page
      web-4-4:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alex
                  - a.fernandes@easygo.io # Andre
                  - b.choi@easygo.io # Brian
                  - c.li@easygo.io # Coco
                  - el.liu@easygo.io # Elaine
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - larissa@easygo.io # Larissa
                  - y.levraud@easygo.io # Yohann
                  - j.khan@easygo.io # Zeb
                  - p.howard@easygo.io # Peter
                  - j.brown@easygo.io # Jeremy
                  - edward@easygo.io # Eddie
                  - c.nehme@easygo.io # Charbel
                  - stage1.up@wn1lxpnt.mailosaur.net #Leon test account
                  - j.reyesvera@easygo.io # Juan
                  - z.ingle@easygo.io # Zach
                  - f.mena@easygo.io # Felipe
                  - m.goutry@easygo.io # Martin
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # KICK Ads policy page
      web-4-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
        targeting:
          if:
            - in:
                - var: country
                - ["AR"]
            - enabled
            - disabled
      # Home page personalisation
      web-5:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 2
      web-5-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page personalisation - Phase 3
      web-5-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.sajiv@easygo.io # Ash
                  - b.choi@easygo.io # Brian
                  - c.tzoumanekas@easygo.io # Costa
                  - h.patel@easygo.io # Hemil
                  - k.camacho@easygo.io # Kyrie
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Home page Embedded chat
      embedded-chat:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Playback API
      web-playback:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Ads Preferences
      web-4-3:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - j.khan@easygo.io # Zeb
                  - k.camacho@easygo.io # Kyrie
                  - kyrieteststage@easygo.mailosaur.net # Kyrie test
                  - el.liu@easygo.io # Elaine
                  - argentinaboy@sharebot.net #Milos test account
                  - killybeard91@gmail.com #Milos test account
                  - serbianboy@sharebot.net #Milos test account
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Playback API - Infer content type from URL
      web-playback-infer-content-type:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Onboarding flow
      web-5-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # the web-9 feature flags all fall under streamer analytics
      # Overview section
      web-9-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - streamer
      web-9-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - guest
      web-9-4:
