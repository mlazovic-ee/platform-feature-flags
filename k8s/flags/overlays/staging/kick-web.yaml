        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Individual Stream section
      web-9-5:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
          # Individual Stream section
      argentina-only-test:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: country
                - ["AR"]
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Dynamic encoding settings in frontend to call chnl-engagement-service for channel_type values
      encoding-settings:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Guest HD trial A/B test (control / variant-a 480p / variant-b 720p)
      web-11:
        state: ENABLED
        defaultVariant: control
        variants:
          control: "control"
          variant-a: "variant-a" # 480p cap.
          variant-b: "variant-b" # 720 cap.
        targeting:
          fractional:
            - - control
              - 50
            - - variant-a
              - 25
            - - variant-b
              - 25
      # Insider SDK
      web-12:
