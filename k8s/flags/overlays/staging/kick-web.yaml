apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Drops Feature - authenticated users
      web1:
        defaultVariant: disabled
        state: ENABLED
        targeting:
          if:
            - or:
                - in:
                    - internal
                    - var: user.roles
                - in:
                    - drops-external
                    - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Drops Feature - unauthenticated users
      web1-guest:
        defaultVariant: disabled
        state: ENABLED
        variants:
          disabled: false
          enabled: true
      # Featured Livestreams Web Gateway
      web-feat-livestreams:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Chat History Web Gateway
      web-chat-history:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Livestreams Home Web Gateway
      web-livestreams-home:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Send tracking.user.watch.livestream event through websocket
      web-watch-event:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # FingerprintJS Proof of Concept
      operation-eagle:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - fractional:
                - - enabled
                  - 99
                - - disabled
                  - 1
        variants:
          enabled: true
          disabled: false
      # FingerprintJS Cache Time
      operation-eagle-cache:
        state: ENABLED
        defaultVariant: one
        variants:
          one: 7200 # 2 hours
          two: 28800 # 8 hours
          three: 86400 # 24 hours
      # KICKs Feature
      web2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner Config
      home-banner-config:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled:
            title: "BRAND REFRESH"
            linkText: "Watch now"
            linkLocation: "/terms-of-service"
            imageLink: "https://files.kick.com/images/banner_image/default-banner-4.jpg"
          disabled: {}
      # Web revenue page
      web-revenue-page:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      kicks-leaderboard:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # allow web clients to connect to pusher-2
      pusher-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      domain-1:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
