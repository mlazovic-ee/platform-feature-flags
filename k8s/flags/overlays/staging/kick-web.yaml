apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Mux SDK Analytics - Toggle the mux sdk analytics sdk on the player for web clients
      # disabled: MuxTracker component not rendered, no data sent to Mux
      # enabled: MuxTracker component rendered, data sent to Mux
      web-13:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Go Live - Toggle the go live feature for creators
      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-go-live:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Download Profile for Recommended Encoding Settings - Link to download OBS profile file containing recommended encoding settings, which can be imported inside OBS
      # disabled: not visible to creators
      # enabled: visible to creators with a link to download the profile
      web-recommended-encoding-settings-profile-download:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
                  - dusanradojevic@mebit.io # Dusan
                  - r.gole@easygo.io # Rohan
                  - y.levraud@easygo.io # Yohann
                  - jc.yu@easygo.io # JC
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Web Disconnect Protection for Advanced Settings - Toggle disconnect protection for creator channel, which will keep the stream running even if the connection between encoder and Kick is interrupted for a short period of time.
      # disabled: not visible to creators
      # enabled: visible to creators with a toggle to enable/disable the feature
      web-disconnect-protection:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
                  - dusanradojevic@mebit.io # Dusan
                  - r.gole@easygo.io # Rohan
                  - y.levraud@easygo.io # Yohann
                  - jc.yu@easygo.io # JC
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # allow web clients to connect to pusher-2
      pusher-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic on critical pages
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance lax verification logic
      trust-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Masthead Display Ads
      web-4:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # In-feed Ads
      web-4-1:
