apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          fractional:
            - - enabled
              - 50
            - - disabled
              - 50
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
      test-flag:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - "1"
                  - "2"
                  - "3"
            - enabled
            - disabled
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
          pusher3: "pusher-3"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 150 # jett
                  - 151 # random
            - fractional:
                  - - pusher
                    - 33
                  - - pusher2
                    - 33
                  - - pusher2
                    - 33
            - pusher
      broadcast_chat_to_pusher:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 150 # jett
            - fractional:
                  - - enabled
                    - 50
                  - - disabled
                    - 50
            - enabled
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 37 # set the active livestream
            - enabled
            - disabled
      schema_based_producers_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 11265
            - enabled
            - disabled
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: targetingKey
                - - 296 # m.meana@easygo.io
                  - 260 # p.costa@easygo.io
                  - 263 # pcostag
                  - 1963461 # i.pavkovic@easygo.io
                  - 1950474 # m.pajic@easygo.io
                  - 1950360 # a.zivanovic@easygo.io
                  - 1950357 # m.lazovic@easygo.io
                  - 1963435 # j.tan@easygo.io
                  - 1950353 # y.levraud@easygo.io
                  - 290 # c.escobidal@easygo.io
                  - 1963545 # japan_acc_test
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
