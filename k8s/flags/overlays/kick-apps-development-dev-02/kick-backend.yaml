apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      # Controls the fraction of requests for which Mux SDK IsEnabled is set in media-metadata.
      # 0.0 = disabled for all, 1.0 = enabled for all.
      # Authenticated users are bucketed consistently by user ID; anonymous users are sampled randomly.
      media_metadata_mux_sampling_rate:
        state: ENABLED
        defaultVariant: full
        variants:
          off: 0.0
          full: 1.0
          tenPercent: 0.1
      platform_batch_bans_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Enable IVS view counts globally or specify a livestream id
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: livestream_id
                - - 38 # set the active livestream
            - enabled
            - disabled
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: channel_id
                - - 27
            - enabled
            - disabled
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      user_events_outbox:
        state: DISABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      paypal_integration:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      slots_and_casino_bot_logic:
        state: ENABLED
        defaultVariant: log
        variants:
          disabled: 0
          log: 1
          enabled: 2
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view_count_outbox_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      outbox_row_lock_claim:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      batch_notifications:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      validate_watch_events:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # When enabled, monolith would call chat-history-service to
      # check if a given user has ever sent a message in a channel.
      user_channel_has_chatted:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chnl_settings_batch_get_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
