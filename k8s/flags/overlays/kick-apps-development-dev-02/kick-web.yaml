apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # Route global realtime through ws-router
      web-rt1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Route chat realtime through ws-router (chatrooms.*.v2)
      web-rt2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: true
          enabled: false
      # /videos endpoint
      domain-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance "forced" verification logic
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance lax verification logic
      trust-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Mid-roll Ads
      web-4-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.li@easygo.io # Coco
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
                  - p.howard@easygo.io # Peter
            - enabled
            - disabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Home page personalisation - Phase 3
      web-5-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page Embedded chat
      embedded-chat:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # the web-9 feature flags all fall under streamer analytics
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Individual Stream section
      web-9-5:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Granular streamer tier in analytics
      web-9-7:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Guest HD trial A/B test (control / variant-a 480p / variant-b 720p)
      web-11:
        state: ENABLED
        defaultVariant: control
        variants:
          control: "control"
          variant-a: "variant-a" # 480p cap.
          variant-b: "variant-b" # 720 cap.
        targeting:
          fractional:
            - - control
              - 50
            - - variant-a
              - 25
            - - variant-b
              - 25
      # Dynamic encoding settings in frontend to call chnl-engagement-service for channel_type values
      encoding-settings:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Gamification Phase 1 - Global badges + leveling dropdown
      web-16-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Insider SDK
      web-12:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Show view count
      web-17:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Partner fast track
      web-18:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Web gateway clip endpoints
      web-19:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Ambient Cinematic Player
      web-ambient-player:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Daily Rewards
      web-21:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Riot Games linked account connection
      web-25:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Web Video preview
      web-27:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Daily Rewards streaks
      web-28:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
