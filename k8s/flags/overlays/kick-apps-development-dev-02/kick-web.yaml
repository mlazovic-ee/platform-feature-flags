      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-23:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # GTA VI truck QR campaign state for the /qr/code route (DAP-1566). Server-only.
      # upcoming: "You're early!" page, live: sign-up and daily reward flow, ended: standard 404
      web-48:
        state: ENABLED
        defaultVariant: upcoming
        variants:
          upcoming: "upcoming"
          live: "live"
          ended: "ended"
      # Kick redesign theme preview switch in Settings > Preferences (FE-116). Server-only, limited to named staff.
      # disabled: the switch is hidden and a kick_theme=next cookie renders today's look
      # enabled: the switch shows and the cookie renders the redesign theme on the next page load
      web-49:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alexander Ruberto
                  - d.ha@easygo.io # Duc Ha
                  - m.meana@easygo.io # Mateo
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
