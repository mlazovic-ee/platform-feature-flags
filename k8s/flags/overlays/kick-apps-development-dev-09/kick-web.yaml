apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # KICKs goals in the streamer dashboard (KICK-9825)
      web-41:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Kick Health - Toggle the channel info endpoint from intercluster to cloudflare. Will increase latency by 100ms.
      # disabled: intercluster
      # enabled: cloudflare
      keath-info:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Homepage Banner
      home-banner:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # /me endpoint
      domain-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: true
          enabled: false
      # Kicks Pinned Messages
      web-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance Home Banner
      trust-4:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance platform mode
      trust-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Age Assurance category mode
      trust-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Mandatory account gate for logged-out users in listed countries
      trust-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          disabled: false
          enabled: true
      # Paypal Integration
      fsp:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Home page personalisation - Phase 3
      web-5-3:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Home page Embedded chat
      embedded-chat:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Dynamic encoding settings in frontend to call chnl-engagement-service for channel_type values
      encoding-settings:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Riot Games linked account connection
      web-25:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Web Video preview
      web-27:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # IMA Ad Component
      web-29:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # IMA Ad Component (prerolls only)
      web-29-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # kill gifts
      web-30:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # PIN/UNPIN videos
      web-36:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # In-Stream Captions/Translations
      web-39:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      web-39-1:
        state: ENABLED
        defaultVariant: v3
        variants:
          v1: "v1"
          v2: "v2"
          v3: "v3"
      web-39-1-1:
        state: ENABLED
        defaultVariant: aws
        variants:
          aws: "aws"
          media-translation: "media-translation"
      # Disable payment related acttions
      payments-disabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Day-one experience
      web-40:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # First-time chatter activity feed
      web-42:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Register & login via the Go user-identity endpoints instead of the PHP monolith
      go-identity-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Events homepage and sidebar entry
      web-43:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Global hourly gifted subs leaderboard
      web-44:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Home page global gifted subs top channels livestream section
      web-44-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Global leaderboard page
      web-44-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      web-46:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # MoQ stream health in the creator dashboard
      web-47:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # MoQ ads in the creator dashboard
      web-47-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Go Live - Toggle the go live feature for creators
      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-23:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # GTA VI truck QR campaign state for the /qr/code route (DAP-1566). Server-only.
      # upcoming: "You're early!" page, live: sign-up and daily reward flow, ended: standard 404
      web-48:
        state: ENABLED
        defaultVariant: upcoming
        variants:
          upcoming: "upcoming"
          live: "live"
          ended: "ended"
      # Kick redesign theme preview switch in Settings > Preferences (FE-116). Server-only, limited to named staff.
      # disabled: the switch is hidden and a kick_theme=next cookie renders today's look
      # enabled: the switch shows and the cookie renders the redesign theme on the next page load
      web-49:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alexander Ruberto
                  - d.ha@easygo.io # Duc Ha
                  - m.meana@easygo.io # Mateo
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Settings as a modal opened via the ?settings= query param on the current page, e.g. /browse?settings=profile, instead of the /settings pages (Settings Uplift).
      # disabled: the user menu links to the old /settings pages and the ?settings= query param is ignored
      # enabled: the user menu opens the modal in place and the ?settings=<section> query param opens that section
      web-50:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Streak recharge
      web-51:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Favourite emotes tab and hearts in the chat emote picker (KICK-9849). Favourites are stored
      # against the account through gateway-web /v1/chat/emotes/favourites.
      # disabled: picker shows no Favourites section and no hearts
      # enabled: Favourites tab after Frequently Used, hover heart to add or remove
      favourite-emotes:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Profile skins: user menu card, chat profile card, Profile Themes tab and unlock reveal (DAP-1657).
      # enabled: skin surfaces show. disabled: skin surfaces are hidden.
      web-52:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Similar Channels sidebar section (KICK-9860)
      web-53:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Live preview in the sidebar channel hover popup (KICK-9937)
      web-59:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Caption language tag on featured banner info, thumbnails, live streams.
      # enabled: the tag shows the caption languages with a tooltip. disabled: the plain language tag shows.
      web-54:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Event reminder notifications
      web-55:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Translated stream titles on featured streams (DAP-1719)
      web-56:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # About app news and press posts.
      # enabled: the posts come from the CMS. disabled: the posts in the about app code show.
      web-57:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - a.ruberto@easygo.io # Alexander Ruberto
                  - m.goutry@easygo.io # Martin Goutry
                  - y.levraud@easygo.io # Yohann Levraud
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Live viewer count updates over the realtime connection, with the poll as fallback (PLAT-646)
      # enabled: the viewer count also updates from ViewerCountUpdated pushes. disabled: it only polls.
      web-62:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Automatic translation toggle in Settings > Preferences (DII-1017)
      # enabled: the "Automatically translate to your display language" toggle shows. disabled: it's hidden.
      web-60:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Storyboard thumbnails on the live seek bar of the main channel page (VAP-1610). Remove after full rollout.
      # enabled: hovering the seek bar shows storyboard thumbnails. disabled: no thumbnails show.
      web-58:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Dashboard saves leaderboard period settings (KICKs + gifted subs) to chnl-settings via gateway-web (KICK-9859).
      # Goes to 100% together with kick-backend subs_leaderboard_settings_from_go.
      leaderboard-settings:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Viewer reads the gifted subs leaderboard from gateway-web instead of PHP (KICK-9859). % rollout by user id.
      subs-leaderboard-gateway:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Dashboard catalog playback flag (VAP-113). Remove after full rollout.
      # enabled: the dashboard player calls the playback API via catalog. disabled: it uses the current playback path.
      web-61:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Stripe Checkout Sessions purchase flow for subscriptions, gifts and KICKs (FS-539). Per user.
      # enabled: the Checkout dialog (Stripe Checkout Session behind Kick's Elements UI). disabled: the legacy payment dialog.
      web-63:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
