apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      platform_batch_bans_enabled:
        state: ENABLED
        variants:
          enabled: true
          disabled: false
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: channel_id
                - - "1"
                  - "2"
                  - "3"
            - enabled
            - disabled
      medialibrary_vips:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway# Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: 'pusher'
          pusher2: 'pusher-2'
        targeting:
          if:
          - in:
              - var: channel_id
              - - "151"
          - pusher2
          - pusher
