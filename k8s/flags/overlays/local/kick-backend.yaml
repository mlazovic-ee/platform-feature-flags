apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-backend
spec:
  flagSpec:
    flags:
      platform_batch_bans_enabled:
        state: ENABLED
        variants:
          enabled: true
          disabled: false
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: channel_id
                - - "1"
                  - "2"
                  - "3"
            - enabled
            - disabled
      medialibrary_vips:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      ws_analytics_tracking_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Revenue page web gateway
      web-revenue-page:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      pusher_cluster:
        state: ENABLED
        defaultVariant: pusher
        variants:
          pusher: "pusher"
          pusher2: "pusher-2"
        targeting:
          if:
            - in:
                - var: channel_id
                - - 151
                  - 150
            - fractional:
                  - - pusher
                    - 50
                  - - pusher2
                    - 50
            - pusher
      ivs_view_count:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      stripe_purchase_otp:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
        targeting:
          if:
            - in:
                - var: username
                - - cleidoscope
            - enabled
            - disabled
      vod_tiering:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # enforces per bucket expiry for VOD tiering, instead of the 30 days default
      vod_tiering_per_bucket_expiry:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chat_settings_read_source:
        state: ENABLED
        defaultVariant: useGo
        variants:
          disabled: 0 # only read from php
          shadow: 1 # we will do a dual read, one to php one to go
          useGo: 2 # we will do a single read, just to go
      bulk_full_sync_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_null_username_users_to_v2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      bulk_sync_category_preferences:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      ad_break_enabled:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      chatroom_sync:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      filter_banned_users_from_leaderboards:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      user_info_update:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
