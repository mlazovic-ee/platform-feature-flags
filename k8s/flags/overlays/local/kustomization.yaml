apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-open-feature

resources:
  - ../../base
  - kick-backend.yaml
  - kick-platform.yaml
  - kick-mobile.yaml
  - kick-tv.yaml
  - kick-web.yaml
patches:
  - target:
      group: core.openfeature.dev
      version: v1beta1
      kind: Flagd
      name: client-side
    patch: |-
      - op: replace
        path: /spec/ingress/hosts/0
        value: flags.kick-local.com
      - op: replace
        path: /spec/ingress/ingressClassName
        value: nginx
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: core.openfeature.dev
      version: v1beta1
      kind: Flagd
      name: client-side-mobile
    patch: |-
      - op: replace
        path: /spec/ingress/hosts/0
        value: mobile.flags.kick-local.com
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: core.openfeature.dev
      version: v1beta1
      kind: Flagd
      name: server-side
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
    patch: |-
      apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      metadata:
        name: mutate-flagd-resources
      $patch: delete
