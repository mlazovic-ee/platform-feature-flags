      # Riot Games linked account connection
      web-25:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # kill gifts
      web-30:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Streamer calendar
      web-32:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Streamer calendar - Export to calendar
      web-32-2:
