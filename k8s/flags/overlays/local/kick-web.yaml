apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # KICKs goals in the streamer dashboard (KICK-9825)
      web-41:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Thumbnail Update - Toggle the ability for creators to update their channel thumbnail from the creator dashboard
      # disabled: not visible to creators
      # enabled: visible to creators with a button to update the thumbnail
      web-13-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - c.li@easygo.io # Coco
                  - kyrie@kick.com # Kyrie
                  - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt Hogben
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
                  - a.namasivayam@easygo.io # Arvind
                  - s.chu@easygo.io # Chu
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Mux SDK Analytics - Toggle the mux sdk analytics sdk on the player for web clients
      # disabled: MuxTracker component not rendered, no data sent to Mux
      # enabled: MuxTracker component rendered, data sent to Mux
      web-13::
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Go Live - Toggle the go live feature for creators
      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-go-live:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Download Profile for Recommended Encoding Settings - Link to download OBS profile file containing recommended encoding settings, which can be imported inside OBS
      # disabled: not visible to creators
      # enabled: visible to creators with a link to download the profile
      web-recommended-encoding-settings-profile-download:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Web Disconnect Protection for Advanced Settings - Toggle disconnect protection for creator channel, which will keep the stream running even if the connection between encoder and Kick is interrupted for a short period of time.
      # disabled: not visible to creators
      # enabled: visible to creators with a toggle to enable/disable the feature
      web-disconnect-protection:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      web-test:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # the web-9 feature flags all fall under streamer analytics
      # Overview section
      web-9-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - streamer
      web-9-3:
