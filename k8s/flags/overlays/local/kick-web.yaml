apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      # KICKs goals in the streamer dashboard (KICK-9825)
      web-41:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Thumbnail Update - Toggle the ability for creators to update their channel thumbnail from the creator dashboard
      # disabled: not visible to creators
      # enabled: visible to creators with a button to update the thumbnail
      web-13-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - c.li@easygo.io # Coco
                  - kyrie@kick.com # Kyrie
                  - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt Hogben
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
                  - a.namasivayam@easygo.io # Arvind
                  - s.chu@easygo.io # Chu
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Mux SDK Analytics - Toggle the mux sdk analytics sdk on the player for web clients
      # disabled: MuxTracker component not rendered, no data sent to Mux
      # enabled: MuxTracker component rendered, data sent to Mux
      web-13::
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Go Live - Toggle the go live feature for creators
      # disabled: not visible to creators
      # enabled: visible to creators with a button to go live from main page navigation bar
      web-go-live:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Download Profile for Recommended Encoding Settings - Link to download OBS profile file containing recommended encoding settings, which can be imported inside OBS
      # disabled: not visible to creators
      # enabled: visible to creators with a link to download the profile
      web-recommended-encoding-settings-profile-download:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Web Disconnect Protection for Advanced Settings - Toggle disconnect protection for creator channel, which will keep the stream running even if the connection between encoder and Kick is interrupted for a short period of time.
      # disabled: not visible to creators
      # enabled: visible to creators with a toggle to enable/disable the feature
      web-disconnect-protection:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.fernandes@easygo.io # Andre
                  - c.tatli@easygo.io # Chris
                  - d.gunawardena@easygo.io # Damitha
                  - j.brown@easygo.io # Jeremy
                  - j.reyesvera@easygo.io # Juan
                  - m.hogben@easygo.io # Matt
                  - p.howard@easygo.io # Peter
                  - f.mena@easygo.io # Felipe
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      web-test:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Insider SDK
      web-12:
        state: ENABLED
        defaultVariant: enabled
        variants:
          disabled: false
          enabled: true
      # Riot Games linked account connection
      web-25:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # kill gifts
      web-30:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # PIN/UNPIN videos
      web-36:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # In-Stream Captions/Translations
      web-39:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      web-39-1:
        state: ENABLED
        defaultVariant: v3
        variants:
          v1: "v1"
          v2: "v2"
          v3: "v3"
      web-39-1-1:
        state: ENABLED
        defaultVariant: aws
        variants:
          aws: "aws"
          media-translation: "media-translation"
      # Disable payment related acttions
      payments-disabled:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # First-time chatter activity feed
      web-42:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Register & login via the Go user-identity endpoints instead of the PHP monolith
      go-identity-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Events homepage and sidebar entry
      web-43:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Global hourly gifted subs leaderboard
      web-44:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Home page global gifted subs top channels livestream section
      web-44-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Global leaderboard page
      web-44-2:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      web-46:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # MoQ stream health in the creator dashboard
      web-47:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # MoQ ads in the creator dashboard
      web-47-1:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # GTA VI truck QR campaign state for the /qr/code route (DAP-1566). Server-only.
      # upcoming: "You're early!" page, live: sign-up and daily reward flow, ended: standard 404
      web-48:
        state: ENABLED
        defaultVariant: upcoming
        variants:
          upcoming: "upcoming"
          live: "live"
          ended: "ended"
      # Kick redesign theme preview switch in Settings > Preferences (FE-116). Server-only, limited to named staff.
      # disabled: the switch is hidden and a kick_theme=next cookie renders today's look
      # enabled: the switch shows and the cookie renders the redesign theme on the next page load
      web-49:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - a.ruberto@easygo.io # Alexander Ruberto
                  - d.ha@easygo.io # Duc Ha
                  - m.meana@easygo.io # Mateo
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Settings as a modal opened via the ?settings= query param on the current page, e.g. /browse?settings=profile, instead of the /settings pages (Settings Uplift).
      # disabled: the user menu links to the old /settings pages and the ?settings= query param is ignored
      # enabled: the user menu opens the modal in place and the ?settings=<section> query param opens that section
      web-50:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false    
      # Streak recharge
      web-51:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - c.li@easygo.io # Coco
                  - h.patel@easygo.io # Hemil
                  - k.camacho@easygo.io # Kyrie
                  - kyrie@kick.com # Kyrie
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # Favourite emotes tab and hearts in the chat emote picker (KICK-9849). Favourites are stored
      # against the account through gateway-web /v1/chat/emotes/favourites.
      # disabled: picker shows no Favourites section and no hearts
      # enabled: Favourites tab after Frequently Used, hover heart to add or remove
      favourite-emotes:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Profile skins: user menu card, chat profile card, Profile Themes tab and unlock reveal (DAP-1657).
      # enabled: skin surfaces show. disabled: skin surfaces are hidden.
      web-52:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Caption language tag on featured banner info, thumbnails, live streams.
      # enabled: the tag shows the caption languages with a tooltip. disabled: the plain language tag shows.
      web-54:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Event reminder notifications
      web-55:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - internal
                - var: user.roles
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
      # About app news and press posts.
      # enabled: the posts come from the CMS. disabled: the posts in the about app code show.
      web-57:
        state: ENABLED
        defaultVariant: disabled
        targeting:
          if:
            - in:
                - var: user.email
                - - m.meana@easygo.io # Mateo
                  - a.ruberto@easygo.io # Alexander Ruberto
                  - m.goutry@easygo.io # Martin Goutry
            - enabled
            - disabled
        variants:
          enabled: true
          disabled: false
