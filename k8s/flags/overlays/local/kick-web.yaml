        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
