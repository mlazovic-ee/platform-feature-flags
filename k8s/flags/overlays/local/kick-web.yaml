apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlag
metadata:
  name: kick-web
spec:
  flagSpec:
    flags:
      web-test:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Clip chat command - when enabled, /clip is available in chat
      web-6:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # Watch time storage and eligibility
      web-7:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # KICK Drops
      web-8:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      view-chat-thread:
        state: ENABLED
        defaultVariant: enabled
        variants:
          enabled: true
          disabled: false
      # the web-9 feature flags all fall under streamer analytics
      # Overview section
      web-9-1:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Streams section
      web-9-2:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - streamer
      web-9-3:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Partnership section - guest
      web-9-4:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
      # Individual Stream section
      web-9-5:
        state: ENABLED
        defaultVariant: disabled
        variants:
          enabled: true
          disabled: false
