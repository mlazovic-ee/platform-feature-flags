apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-flagd-resources
spec:
  rules:
    - name: set-flagd-client-side-resources
      match:
        resources:
          kinds:
            - Pod
          selector:
            matchLabels:
              app: client-side
              app.kubernetes.io/managed-by: open-feature-operator
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              ad.datadoghq.com/flagd.checks: |
                {
                  "openmetrics": {
                    "init_config": {},
                    "instances": [
                      {
                        "openmetrics_endpoint": "http://%%host%%:8014/metrics",
                        "metrics": [
                          "http.server.duration",
                          "http.server.response.size",
                          "http.server.active_requests",
                          "feature_flag.flagd.impression",
                          "feature_flag.flagd.evaluation.reason"
                        ]
                      }
                    ]
                  }
                }
          spec:
            terminationGracePeriodSeconds: 45
            containers:
              - name: flagd
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 20
                resources:
                  limits:
                    cpu: 1000m
                    memory: "2048Mi"
                  requests:
                    cpu: 500m
                    memory: "1024Mi"
    - name: set-flagd-client-side-mobile-resources
      match:
        resources:
          kinds:
            - Pod
          selector:
            matchLabels:
              app: client-side-mobile
              app.kubernetes.io/managed-by: open-feature-operator
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              ad.datadoghq.com/flagd.checks: |
                {
                  "openmetrics": {
                    "init_config": {},
                    "instances": [
                      {
                        "openmetrics_endpoint": "http://%%host%%:8014/metrics",
                        "metrics": [
                          "http.server.duration",
                          "http.server.response.size",
                          "http.server.active_requests",
                          "feature_flag.flagd.impression",
                          "feature_flag.flagd.evaluation.reason"
                        ]
                      }
                    ]
                  }
                }
          spec:
            terminationGracePeriodSeconds: 45
            containers:
              - name: flagd
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 20
                resources:
                  limits:
                    cpu: 1000m
                    memory: "2048Mi"
                  requests:
                    cpu: 500m
                    memory: "1024Mi"
    - name: set-flagd-server-side-resources
      match:
        resources:
          kinds:
            - Pod
          selector:
            matchLabels:
              app: server-side
              app.kubernetes.io/managed-by: open-feature-operator
      mutate:
        patchStrategicMerge:
          metadata:
            annotations:
              ad.datadoghq.com/flagd.checks: |
                {
                  "openmetrics": {
                    "init_config": {},
                    "instances": [
                      {
                        "openmetrics_endpoint": "http://%%host%%:8014/metrics",
                        "metrics": [
                          "http.server.duration",
                          "http.server.response.size",
                          "http.server.active_requests",
                          "feature_flag.flagd.impression",
                          "feature_flag.flagd.evaluation.reason"
                        ]
                      }
                    ]
                  }
                }
          spec:
            # Outlive SIGTERM briefly so the ALB deregisters this pod before flagd
            # stops accepting connections, avoiding a request being dispatched onto
            # a socket that is already closing. Native SleepAction (k8s >= 1.30) is
            # used rather than exec: the flagd image is distroless and has no shell.
            # Grace period must exceed the sleep so flagd still gets time to exit.
            terminationGracePeriodSeconds: 45
            containers:
              - name: flagd
                lifecycle:
                  preStop:
                    sleep:
                      seconds: 20
                resources:
                  limits:
                    cpu: 1000m
                    memory: "2048Mi"
                  requests:
                    cpu: 500m
                    memory: "1024Mi"
  validationFailureAction: Audit
