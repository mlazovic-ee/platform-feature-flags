apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: server-side
  namespace: platform-open-feature
spec:
  sources:
    - source: platform-open-feature/kick-backend
      provider: kubernetes
    - source: platform-open-feature/kick-platform
      provider: kubernetes
    - source: platform-open-feature/kick-web
      provider: kubernetes
---
apiVersion: core.openfeature.dev/v1beta1
kind: FeatureFlagSource
metadata:
  name: client-side
  namespace: platform-open-feature
spec:
  sources:
    - source: platform-open-feature/kick-web-client
      provider: kubernetes
    - source: platform-open-feature/kick-mobile
      provider: kubernetes
    - source: platform-open-feature/kick-tv
      provider: kubernetes
