apiVersion: core.openfeature.dev/v1beta1
kind: Flagd
metadata:
  name: main
  namespace: platform-open-feature
spec:
  replicas: PLACEHOLDER
  featureFlagSource: platform
  ingress:
    enabled: true
    annotations:
      alb.ingress.kubernetes.io/target-type: "ip"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    hosts:
      - PLACEHOLDER
    ingressClassName: kick-flags-alb
    pathType: Prefix
