apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-feature-flags
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              values:
                cluster_name: '{{index .metadata.annotations "cluster_name"}}'
          - git:
              repoURL: https://github.com/KickEngineering/platform-feature-flags.git
              revision: main
              directories:
                - path: 'k8s/flags/overlays/{{.values.cluster_name}}*'
  template:
    metadata:
      name: '{{if eq .values.cluster_name .path.basename}}platform-feature-flags{{else}}platform-feature-flags{{trimPrefix .values.cluster_name .path.basename}}{{end}}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/KickEngineering/platform-feature-flags.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: '{{.server}}'
        namespace: '{{if eq .values.cluster_name .path.basename}}platform-open-feature{{else}}platform-open-feature{{trimPrefix .values.cluster_name .path.basename}}{{end}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
