apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-feature-flags
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        values:
          cluster_name: '{{index .metadata.annotations "cluster_name"}}'
  template:
    metadata:
      name: "platform-feature-flags"
    spec:
      project: platform
      source:
        repoURL: https://github.com/KickEngineering/platform-feature-flags.git
        targetRevision: main
        path: 'k8s/flags/overlays/{{.values.cluster_name}}'
      destination:
        server: '{{.server}}'
        namespace: platform-open-feature
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
