on:
  workflow_call:
    inputs:
      directory:
        type: string
        required: true
      component:
        type: string
        required: true
      environments:
        type: string
        required: true


jobs:
  component:
    name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments) }}
    uses: KickEngineering/platform-github-workflows/.github/workflows/ci-kustomize.yaml@main
    with:
      path: ${{ inputs.directory }}/${{ inputs.component }}/overlays/${{ matrix.environment }}
      name: "Diff ${{ inputs.component }} for ${{ matrix.environment }}"

  validate:
    name: Validate ${{ matrix.environment }} FeatureFlags
    runs-on: ubuntu-latest
    env:
      DIRECTORY: ${{ inputs.directory }}/${{ inputs.component }}/overlays/${{ matrix.environment }}
    strategy:
      matrix:
        environment: ${{ fromJSON(inputs.environments) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./scripts/validate/go.mod
          cache-dependency-path: ./scripts/validate/go.sum

      - name: Install tools
        uses: KickEngineering/platform-github-actions/install-tools@install-tools/v1.0.0
        with:
          kustomize: v5.4.3

      - name: kustomize build
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          kustomize build --enable-helm --load-restrictor LoadRestrictionsNone ${{ env.DIRECTORY }} > FeatureFlags.yaml

      - name: Validate FeatureFlags
        working-directory: ./scripts/validate
        run: |
          go run main.go ../../FeatureFlags.yaml
